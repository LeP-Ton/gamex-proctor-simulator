name: 发布监考模拟器版本选择页

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"
      - "scripts/build-pages.mjs"
      - "sites/**"
      - "public/favicon.svg"
      - "tests/pages.test.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: 检查并构建版本选择页
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: 验证入口、旧书签与构建边界
        run: node --test tests/pages.test.mjs
      - name: 仅构建选择页与兼容跳转
        run: node scripts/build-pages.mjs --output dist
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  deploy:
    name: 部署版本选择页
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
