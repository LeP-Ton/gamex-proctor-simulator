name: 请求双版本 Pages 发布

on:
  push:
    branches: [codex/illustrated, codex/realistic]
    paths:
      - "src/**"
      - "public/**"
      - "tests/**"
      - "index.html"
      - "vite.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".npmrc"
      - "tsconfig*.json"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  actions: write

jobs:
  request:
    name: 请求 main 联合发布两个版本
    runs-on: ubuntu-latest
    steps:
      - name: 触发中央 Pages 工作流
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main --repo "$GITHUB_REPOSITORY"
