name: 独立发布写实版到 Pages

on:
  push:
    branches: [codex/realistic]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/codex/realistic'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: 安装锁定依赖
        run: npm ci
      - name: 运行本版本核心测试
        run: npm test
      - name: 构建本版本
        run: npm run build
      - name: 记录源分支与固定提交
        run: |
          if [ -f public/deployment.json ]; then
            cat public/deployment.json >> "$GITHUB_STEP_SUMMARY"
          else
            printf '源码分支提交：%s\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/configure-pages@v6
        if: github.repository == 'LeP-Ton/gamex-proctor-realistic'
      - uses: actions/upload-pages-artifact@v5
        if: github.repository == 'LeP-Ton/gamex-proctor-realistic'
        with:
          path: dist
  deploy:
    if: github.repository == 'LeP-Ton/gamex-proctor-realistic' && github.ref == 'refs/heads/codex/realistic'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署本版本独立站点
        id: deployment
        uses: actions/deploy-pages@v5
